# Builds and tests Lemon Studio on Windows, Linux and macOS for every push to main and every pull request, so a change
# that breaks any platform shows up before it is merged.
name: CI

on:
  push:
    branches: [main, knay-lemon]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Lemon Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      # libclang: the time stretcher's bindings are generated at build time (the Windows image ships LLVM, the macOS one Xcode's).
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        id: build
        run: cargo build --workspace --all-targets --locked

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      - name: Bundle the app
        id: bundle
        if: runner.os == 'macOS'
        run: cargo run -p bundle-app --locked

      # Every platform's crates: the notices test lists them with an offline `cargo tree --target all`.
      - name: Fetch
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      # KNAY: the ready-to-run program, downloadable from the run's Artifacts.
      # Also when tests the edition inherited still fail: the program itself built.
      - name: Build release program (Windows)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        env:
          OPENSTUDIO_NO_PLUGIN_BUILD: "1"
        run: cargo build --locked --release -p os-app

      - name: Upload Windows program
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: KNAY-Lemon-Studio-Windows
          path: target/release/lemonstudio.exe

      - name: Zip the Mac app
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && runner.os == 'macOS' }}
        run: ditto -c -k --keepParent "target/bundled/Lemon Studio.app" "target/KNAY-Lemon-Studio-Mac.zip"

      - name: Upload Mac app
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: KNAY-Lemon-Studio-Mac
          path: target/KNAY-Lemon-Studio-Mac.zip
